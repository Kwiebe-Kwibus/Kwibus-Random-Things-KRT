name: Discord Release Announcement

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Discord Payload
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_AUTHOR: ${{ github.event.release.author.login }}
          REPO_NAME: ${{ github.repository }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          python3 - << 'EOF'
          import json
          import os
          from datetime import datetime, timezone

          repo = os.environ.get("REPO_NAME", "").strip() or "Kwiebe-Kwibus/Kwibus-Random-Things-KRT"
          tag = os.environ.get("RELEASE_TAG", "").strip() or "1.5.0"
          name = os.environ.get("RELEASE_NAME", "").strip() or f"Kwibus Random Things {tag}"
          body = os.environ.get("RELEASE_BODY", "").strip() or "Test release announcement: Webhook and GitHub Actions workflow are working properly!"
          url = os.environ.get("RELEASE_URL", "").strip() or f"https://github.com/{repo}/releases/tag/{tag}"
          author = os.environ.get("RELEASE_AUTHOR", "").strip() or "Kwiebe-Kwibus"
          published_at = os.environ.get("PUBLISHED_AT", "").strip() or datetime.now(timezone.utc).isoformat()

          title = f"🚀 New Release: {name or tag}"
          if len(title) > 256:
              title = title[:253] + "..."

          description = body if body else "*No release notes provided.*"
          if len(description) > 2000:
              description = description[:1997] + "..."

          download_url = f"https://github.com/{repo}/releases/download/{tag}/KwibusRandomThings-{tag}.zip"
          links_value = f"[View on GitHub]({url}) • [Download ZIP]({download_url})"

          embed = {
              "title": title,
              "color": 16106496,
              "description": description,
              "fields": [
                  {"name": "Version", "value": tag or "Unknown", "inline": True},
                  {"name": "Author", "value": author or "Unknown", "inline": True},
                  {"name": "Links", "value": links_value, "inline": False}
              ],
              "footer": {
                  "text": "Kwibus Random Things • ESO Addon"
              }
          }

          if url:
              embed["url"] = url

          if published_at:
              embed["timestamp"] = published_at

          payload = {"embeds": [embed]}

          with open("discord_payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)

          print("Generated discord_payload.json successfully.")
          EOF

      - name: Send Notification to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is not set in repository settings! Go to Settings -> Secrets and variables -> Actions to add it."
            exit 1
          fi
          curl -sS --fail-with-body -H "Content-Type: application/json" -X POST -d @discord_payload.json "$DISCORD_WEBHOOK_URL"
